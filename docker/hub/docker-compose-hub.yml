version: '3.8'

services:
  # Kafka Broker for Hub
  kafka-hub:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka-hub
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-hub:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_LOG_CLEANUP_POLICY: delete
      CLUSTER_ID: MkQrr1dJ0SnJ5ZrF3kLsqQ
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-hub:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka-hub:29092,CONTROLLER://kafka-hub:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
    volumes:
      - kafka-hub-data:/var/lib/kafka/data
    networks:
      - oracle-sync-hub

  # Kafka Connect for Hub CDC
  kafka-connect-hub:
    image: confluentinc/cp-kafka-connect:7.5.0
    container_name: kafka-connect-hub
    ports:
      - "8083:8083"
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka-hub:29092
      CONNECT_REST_ADVERTISED_HOST_NAME: kafka-connect-hub
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: connect-hub
      CONNECT_CONFIG_STORAGE_TOPIC: connect-configs-hub
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_TOPIC: connect-offsets-hub
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_TOPIC: connect-status-hub
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "true"
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "true"
      CONNECT_INTERNAL_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_INTERNAL_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_LOG4J_ROOT_LOGLEVEL: INFO
      CONNECT_LOG4J_LOGGERS: org.apache.kafka.connect.runtime.rest=WARN,org.reflections=ERROR
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
    depends_on:
      - kafka-hub
    volumes:
      - ./debezium-connector-oracle:/usr/share/confluent-hub-components/debezium-connector-oracle
      - ./debezium-connector-jdbc:/usr/share/confluent-hub-components/debezium-connector-jdbc
    networks:
      - oracle-sync-hub
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Conflict Resolver Service
  conflict-resolver:
    build:
      context: ../../conflict-resolver
      dockerfile: Dockerfile
    container_name: conflict-resolver
    ports:
      - "8080:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka-hub:29092
      KAFKA_GROUP_ID: conflict-resolver-group
      KAFKA_TOPICS: oracle-sync.transactional.z12026,oracle-sync.transactional.zlab,hub.BRANCH_1_oracle.transactional.z12026,hub.BRANCH_1_oracle.transactional.zlab,hub.BRANCH_2_oracle.transactional.z12026,hub.BRANCH_2_oracle.transactional.zlab
      CONFLICT_RESOLVER_STRATEGY: LWW_SCN
      CONFLICT_RESOLVER_THREADS: 1
      LOG_LEVEL: INFO
    depends_on:
      - kafka-hub
    networks:
      - oracle-sync-hub
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prometheus for Metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-hub
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - oracle-sync-hub

  # Grafana for Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: grafana-hub
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - oracle-sync-hub

volumes:
  kafka-hub-data:
  prometheus-data:
  grafana-data:

networks:
  oracle-sync-hub:
    driver: bridge
