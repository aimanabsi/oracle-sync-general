# MirrorMaker2 Branch to Hub Replication Configuration
# This configuration replicates changes from branches to hub for conflict resolution

clusters = hub, branch1, branch2

# Hub cluster configuration
hub.bootstrap.servers = ${KAFKA_HUB_BOOTSTRAP_SERVERS}
hub.security.protocol = PLAINTEXT

# Branch1 cluster configuration
branch1.bootstrap.servers = ${KAFKA_BRANCH1_BOOTSTRAP_SERVERS}
branch1.security.protocol = PLAINTEXT

# Branch2 cluster configuration
branch2.bootstrap.servers = ${KAFKA_BRANCH2_BOOTSTRAP_SERVERS}
branch2.security.protocol = PLAINTEXT

# Branch1 to Hub replication
branch1->hub.enabled = true
branch1->hub.topics = oracle-sync\.transactional\..*
branch1->hub.groups = .*
branch1->hub.sync.topic.configs.enabled = true
branch1->hub.sync.topic.configs.interval.seconds = 60
branch1->hub.sync.group.offsets.enabled = true
branch1->hub.sync.group.offsets.interval.seconds = 60
branch1->hub.sync.group.offsets.lag.max = 1000
branch1->hub.sync.group.offsets.lag.max.ms = 60000
branch1->hub.refresh.topics.enabled = true
branch1->hub.refresh.topics.interval.seconds = 60

# Branch2 to Hub replication
branch2->hub.enabled = true
branch2->hub.topics = oracle-sync\.transactional\..*
branch2->hub.groups = .*
branch2->hub.sync.topic.configs.enabled = true
branch2->hub.sync.topic.configs.interval.seconds = 60
branch2->hub.sync.group.offsets.enabled = true
branch2->hub.sync.group.offsets.interval.seconds = 60
branch2->hub.sync.group.offsets.lag.max = 1000
branch2->hub.sync.group.offsets.lag.max.ms = 60000
branch2->hub.refresh.topics.enabled = true
branch2->hub.refresh.topics.interval.seconds = 60

# Disable reverse replication
hub->branch1.enabled = false
hub->branch2.enabled = false

# Connector configuration
tasks.max = 2
key.converter = org.apache.kafka.connect.converters.ByteArrayConverter
value.converter = org.apache.kafka.connect.converters.ByteArrayConverter
header.converter = org.apache.kafka.connect.converters.ByteArrayConverter

# Replication policy
replication.policy.class = org.apache.kafka.connect.mirror.DefaultReplicationPolicy
replication.policy.separator = .
replication.policy.internal.topic.separator = -

# Checkpoint configuration
checkpoints.topic.replication.factor = 1
heartbeats.topic.replication.factor = 1
offset.syncs.topic.replication.factor = 1

# Consumer and producer configuration
consumer.max.poll.records = 500
consumer.session.timeout.ms = 30000
consumer.heartbeat.interval.ms = 3000
producer.batch.size = 32768
producer.linger.ms = 10
producer.compression.type = snappy

# Offset management
offset.storage.replication.factor = 1
status.storage.replication.factor = 1
config.storage.replication.factor = 1

# Topic naming for branch topics replicated to hub
replication.policy.class = org.apache.kafka.connect.mirror.DefaultReplicationPolicy
